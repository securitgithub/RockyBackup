name: Build RockyBackup Windows x64

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore .\RockyBackupWinForms.csproj

      - name: Publish win-x64 self-contained single-file
        run: >-
          dotnet publish .\RockyBackupWinForms.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -o .\publish

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'publish\RockyBackup.exe'
          if (-not (Test-Path $exe)) {
            throw "RockyBackup.exe not found: $exe"
          }
          Get-Item $exe | Format-List FullName,Length,LastWriteTime

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RockyBackup-win-x64
          path: publish/RockyBackup.exe
          if-no-files-found: error
